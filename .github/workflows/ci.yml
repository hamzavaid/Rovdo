name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    name: Browser + Jobs (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install Electron Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          npx playwright install-deps chromium
          sudo apt-get update
          sudo apt-get install -y gnome-keyring zenity dbus-x11 libdbus-1-3 apparmor
      - name: Allow installed Chromium sandboxes (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]] ||
             [[ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" != "1" ]]; then
            echo "AppArmor user namespace restriction is not enabled; no policy needed."
            exit 0
          fi
          # Ubuntu restricts user namespaces for downloaded browsers. Grant only
          # the exact installed Playwright Chromium/headless-shell executables:
          # https://chromium.googlesource.com/chromium/src/+/main/docs/security/apparmor-userns-restrictions.md
          node scripts/linux-sandbox.ts > "$RUNNER_TEMP/rovdo-playwright.apparmor"
          sudo install -o root -g root -m 644 "$RUNNER_TEMP/rovdo-playwright.apparmor" /etc/apparmor.d/rovdo-playwright
          sudo apparmor_parser --replace /etc/apparmor.d/rovdo-playwright
      - name: Electron and native vault (Linux)
        if: runner.os == 'Linux'
        run: dbus-run-session -- sh -c 'printf "rovdo-ci-fixture\n" | gnome-keyring-daemon --unlock --components=secrets; xvfb-run --auto-servernum npm run test:e2e'
      - name: Electron and native vault (Windows and macOS)
        if: runner.os != 'Linux'
        run: npm run test:e2e
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Verify private documentation is untracked
        shell: bash
        run: test -z "$(git ls-files docs)"
